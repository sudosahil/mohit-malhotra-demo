<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEDEA">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Wedding story | Mohit Malhotra Photography</title>
<meta name="description" content="A wedding story by Mohit Malhotra Photography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="story">
<div class="wipe cover"></div>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<section class="story-head">
  <div style="padding:0 var(--gutter)">
    <h1 class="page-title" id="story-title"></h1>
    <p class="story-meta" id="story-meta"></p>
  </div>
  <button id="story-cover-btn" aria-label="Open cover photograph full screen" style="display:block;width:100%;margin-top:clamp(28px,4vw,56px);cursor:zoom-in"><img id="story-cover" class="story-cover" alt="" fetchpriority="high"></button>
  <div style="padding:0 var(--gutter)"><p class="story-line" id="story-line"></p></div>
</section>
<section class="band"><div class="gallery" id="gallery"></div></section>
<section class="band closer">
  <a class="next-story" id="next-story" href="#"><p style="margin:0 0 18px;color:#b8bcb7">Next story</p><h2 class="page-title" id="next-title"></h2><p id="next-meta" style="margin:18px 0 0;color:#b8bcb7"></p></a>
</section>
</main>
<footer id="site-footer"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="app.js"></script>
<script src="motion.js"></script>
</body>
</html>
